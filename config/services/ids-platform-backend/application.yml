# Canonical non-secret configuration for ids-platform-backend.
#
# This file is the source of truth for the service's deploy-time settings. It is
# shipped to the host and layered over the jar's bundled application.yml via:
#   java -jar app.jar --spring.config.additional-location=optional:file:/opt/ids-platform-backend/application.yml
#
# All secret values (e.g. MONGODB_URI) are NOT here — they are provided as
# environment variables rendered from Vault (see vault.manifest.yml) and
# referenced below as ${ENV_VAR} placeholders.

server:
  port: ${SERVER_PORT:8082}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:ids_platform}
      auto-index-creation: false

mongock:
  migration-scan-package: ro.puk3p.sentinel.migration
  transaction-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sentinel.puk3p.online}
